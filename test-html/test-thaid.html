<!DOCTYPE html>
<html>
<body>
  <button id="loginBtn">Sign in with ThaID</button>
  <pre id="out"></pre>
  <script>
    const API_BASE = 'https://localhost:5100';

    function readFragmentTokens() {
      if (!window.location.hash || window.location.hash.length < 2) return null;
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token');
      if (!accessToken) return null;
      return {
        access_token: accessToken,
        refresh_token: params.get('refresh_token'),
        expires_at: params.get('expires_at')
      };
    }

    const tokens = readFragmentTokens();
    if (tokens) {
      document.getElementById('out').textContent = JSON.stringify(tokens, null, 2);
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    document.getElementById('loginBtn').onclick = () => {
      const returnUrl = window.location.origin + window.location.pathname;
      const url = API_BASE + '/auth/external/thaid/challenge?returnUrl=' + encodeURIComponent(returnUrl);
      window.location.href = url;
    };
  </script>
</body>
</html>
